[mgr]
ratio = [1, 3, 3]
sort_by = "natural"
sort_sensitive = false
sort_dir_first = true
sort_translit = true
show_hidden = true
show_symlink = true

[preview]
wrap = "yes"
max_width  = 3000
max_height = 3000

[opener]

# Ripped from Documentation : [[[
play = [
	{ run = "mpv %s", orphan = true, for = "unix" },
]
edit = [
	{ run = "$EDITOR %s", block = true, for = "unix" },
]
# ]]]

xournal = [
    { run = "xournalpp %s", orphan = true }
]

[open]
rules = [

    # Ripped from Documentation : [[[
    { mime = "text/*", use = "edit" },
	{ mime = "video/*", use = "play" },
    # ]]]

    { url = "*.xopp", use = "xournal" }
]
