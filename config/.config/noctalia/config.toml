[audio]
enable_overdrive = true
enable_sounds = true
notification_sound = "/home/beepew/.config/noctalia/notification.mp3"

[bar]
order = [ "default" ]

    [bar.default]
    capsule = true
    capsule_radius = 8
    capsule_thickness = 0.69999998807907104
    center = [ "taskbar" ]
    end = [ "group:g2", "group:g1" ]
    margin_ends = 250
    padding = 10
    radius = 10
    radius_top_left = 15
    radius_top_right = 15
    scale = 0.95000000670552254
    start = [ "workspaces" ]
    thickness = 30
    widget_spacing = 10

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g1"
        members = [ "volume", "brightness", "bluetooth", "network", "battery", "clock" ]
        opacity = 1.0
        padding = 6.0
        radius = 8.0

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g2"
        members = [ "tray", "widget", "notifications" ]
        opacity = 1.0
        padding = 6.0
        radius = 8.0

[calendar]
enabled = true

    [calendar.account.personal_google]
    name = "Personal Calendar"
    type = "google"

[control_center]
sidebar = "full"
sidebar_section = "full"
width = 870

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "power_profile"

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = [ "desktop-widget-0000000000000001", "desktop-widget-0000000000000002", "desktop-widget-0000000000000003" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 0.0
    box_width = 0.0
    cx = 1600.0
    cy = 828.0
    output = "DP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "calendar"

    [desktop_widgets.widget.desktop-widget-0000000000000002]
    box_height = 0.0
