        [[shell.session.actions]]
        action = "command"
        command = "systemctl reboot --firmware-setup"
        countdown_seconds = 0.0
        enabled = true
        label = "Reboot to UEFI"
        variant = "primary"

[theme]
builtin = "Ayu"
community_palette = "Oxocarbon"
mode = "dark"
pure_black_dark = false
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "hyprland", "kitty", "qt" ]
    community_ids = [ "pywalfox", "discord", "obsidian" ]

        [theme.templates.user.btop]
        input_path = "~/.config/noctalia/templates/btop.theme"
        output_path = "~/.config/btop/themes/matugen.theme"
        post_hook = "pkill -SIGUSR2 btop || true"

        [theme.templates.user.neovim]
        input_path = "~/.config/noctalia/templates/nvim-colors.json"
        output_path = "~/.config/nvim/colors.json"
        post_hook = "pkill -SIGUSR1 nvim"

        [theme.templates.user.starship]
        input_path = "~/.config/noctalia/templates/starship-colors.toml"
        output_path = "~/.config/starship.toml"

        [theme.templates.user.websites-mozilla]
        input_path = "~/.config/noctalia/templates/firefox-colors.css"
        output_path = "~/.mozilla/firefox/colors.css"
        post_hook = "sh ~/.config/noctalia/scripts/install_website_colors.sh"

        [theme.templates.user.yazi]
        input_path = "~/.config/noctalia/templates/yazi-theme.toml"
        output_path = "~/.config/yazi/theme.toml"

[wallpaper]
directory = "/home/beepew/Pictures/Wallpapers"
transition_on_startup = true

    [wallpaper.default]
    path = "/home/beepew/Pictures/Wallpapers/Landscapes/Cloudy Peaks.jpg"

    [wallpaper.last]
