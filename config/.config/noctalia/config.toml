[audio]
enable_overdrive = true
enable_sounds = true
notification_sound = "/home/beepew/.config/noctalia/notification.mp3"

[bar]
order = [ "default" ]

    [bar.default]
    capsule = true
    capsule_radius = 8
    capsule_thickness = 0.69999998807907104
    center = [ "taskbar" ]
    concave_edge_corners = false
    end = [ "group:g2", "group:g1" ]
    margin_ends = 0
    padding = 10
    position = "bottom"
    radius = 0
    radius_top_left = 0
    radius_top_right = 0
    scale = 0.95000000670552254
    start = [ "workspaces" ]
    thickness = 40
    widget_spacing = 10

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g1"
        members = [ "volume", "brightness", "bluetooth", "network", "battery", "clock" ]
        opacity = 1.0
        padding = 6.0
        radius = 8.0

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g2"
        members = [ "tray", "widget", "notifications" ]
        opacity = 1.0
        padding = 6.0
        radius = 8.0

