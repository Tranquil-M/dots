[nightlight]
enabled = true

[notification]
max_visible = 5
offset_y = 10

[osd]
orientation = "vertical"
position = "bottom_center"
position_vertical = "center_right"

[plugin_settings."whyoolw/dropwall"]
copy_to_wallpaper_dir = true

[plugins]
enabled = [ "thepunkoff/pomodoro", "alexander/screen-toolkit", "whyoolw/dropwall", "tadomika_ari/w-engine" ]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

[shell]
avatar_path = "/home/beepew/.pfp.jpg"
password_style = "random"
polkit_agent = true
time_format = "{:%I:%M}"

    [shell.launcher]
    categories = false

    [shell.panel]
    control_center_placement = "floating"
    control_center_position = "center"
    list_item_background = true
    session_placement = "floating"
    session_position = "center"
    transparency_mode = "soft"
    wallpaper_placement = "floating"
    wallpaper_position = "center"

    [shell.screen_corners]
    enabled = true

    [shell.session]
    grid = true

        [[shell.session.actions]]
        action = "lock"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "1"
        variant = "default"

        [[shell.session.actions]]
        action = "logout"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "2"
        variant = "default"

        [[shell.session.actions]]
        action = "lock_and_suspend"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "3"
        variant = "default"

        [[shell.session.actions]]
        action = "reboot"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "4"
        variant = "default"

        [[shell.session.actions]]
        action = "shutdown"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "5"
        variant = "destructive"

        [[shell.session.actions]]
        action = "command"
        command = "systemctl reboot --firmware-setup"
        countdown_seconds = 0.0
        enabled = true
        label = "Reboot to UEFI"
        variant = "primary"

[theme]
builtin = "Ayu"
community_palette = "Oxocarbon"
pure_black_dark = true
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "hyprland", "kitty", "qt" ]
    community_ids = [ "pywalfox", "discord", "obsidian", "yazi" ]

        [theme.templates.user.btop]
        input_path = "~/.config/noctalia/templates/btop.theme"
        output_path = "~/.config/btop/themes/matugen.theme"
        post_hook = "pkill -SIGUSR2 btop || true"

        [theme.templates.user.neovim]
        input_path = "~/.config/noctalia/templates/nvim-colors.json"
        output_path = "~/.config/nvim/colors.json"
        post_hook = "pkill -SIGUSR1 nvim"

        [theme.templates.user.starship]
        input_path = "~/.config/noctalia/templates/starship-colors.toml"
        output_path = "~/.config/starship.toml"

        [theme.templates.user.websites-mozilla]
        input_path = "~/.config/noctalia/templates/firefox-colors.css"
        output_path = "~/.mozilla/firefox/colors.css"
        post_hook = "sh ~/.config/noctalia/scripts/install_website_colors.sh"

[wallpaper]
directory = "/home/beepew/Pictures/Wallpapers"
transition_on_startup = true

    [wallpaper.default]
    path = "/home/beepew/Pictures/Wallpapers/Cat/Kittyboard.png"

    [wallpaper.last]
    path = "/home/beepew/Pictures/Wallpapers/Cat/Kittyboard.png"

    [wallpaper.monitors.DP-1]
    path = "/home/beepew/Pictures/Wallpapers/Kitty.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/beepew/Pictures/Wallpapers/Kitty.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/beepew/Pictures/Wallpapers/Cat/Kittyboard.png"

[widget.clock]
format = "{:%I:%M}"

[widget.network]
show_label = false

[widget.taskbar]
anchor = true
icon_scale = 1.3500000000000001
item_spacing = 10
show_all_outputs = true
show_window_title = true

[widget.tray]
drawer = true

[widget.widget]
type = "thepunkoff/pomodoro:widget"

[widget.workspaces]
focused_output_only = true
label_source = "name"
pill_scale = 0.75
style = "minimal"
