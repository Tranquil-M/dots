    cy = 830.0
    output = "DP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "weather"

[dock]
active_monitor_only = true
cross_axis_padding = 2
icon_size = 24
item_spacing = 0
main_axis_padding = 2

[hooks]
started = "until ping -c 1 8.8.8.8 >/dev/null 2>&1; do sleep 2; done; notify-send \"You have $(( $(checkupdates 2>/dev/null | wc -l) + $(yay -Qua 2>/dev/null | wc -l) + $(flatpak remote-ls --updates 2>/dev/null | wc -l) )) updates waiting for you!\""

[idle]
behavior_order = [ "Sleep Warning", "lock", "screen-off", "lock-and-suspend" ]
pre_action_fade_seconds = 5

    [idle.behavior."Sleep Warning"]
    action = "command"
    command = "notify-send \"Warning!\" \"Your computer will fall asleep in 30 seconds!\""
    enabled = false
    resume_command = "notify-send \"Wuh- huh?\" \"I'm awake!\""
    timeout = 530.0

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
auto_locate = true

[lockscreen]
blur_intensity = 0.79999998211860657
blurred_desktop = true
tint_intensity = 0.53999998793005943

